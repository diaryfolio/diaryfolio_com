<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">A compact decision model routes one request to four processing lanes</title>
  <desc id="desc">An application request passes through deterministic rules and a compact decision model, then routes to a local model, a specialist model, a frontier model or human review.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#087286"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#101920" flood-opacity=".15"/>
    </filter>
  </defs>
  <rect width="960" height="540" rx="28" fill="#f4f7f8"/>
  <path d="M206 270H286M470 270H528M662 270H718" fill="none" stroke="#087286" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M590 230V98H718M590 310V442H718" fill="none" stroke="#087286" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="48" y="210" width="158" height="120" rx="18" fill="#fff" stroke="#b8c7cd" stroke-width="2"/>
    <rect x="286" y="194" width="184" height="152" rx="18" fill="#fff" stroke="#b8c7cd" stroke-width="2"/>
    <rect x="528" y="194" width="134" height="152" rx="24" fill="#e5f2f4" stroke="#087286" stroke-width="3"/>
    <rect x="718" y="42" width="194" height="104" rx="16" fill="#fff" stroke="#b8c7cd" stroke-width="2"/>
    <rect x="718" y="166" width="194" height="104" rx="16" fill="#fff" stroke="#b8c7cd" stroke-width="2"/>
    <rect x="718" y="290" width="194" height="104" rx="16" fill="#fff" stroke="#b8c7cd" stroke-width="2"/>
    <rect x="718" y="414" width="194" height="84" rx="16" fill="#f6ebe7" stroke="#b44a35" stroke-width="2"/>
  </g>
  <g font-family="system-ui, sans-serif" fill="#18232c">
    <text x="127" y="256" text-anchor="middle" font-size="22" font-weight="700">Request</text>
    <text x="127" y="287" text-anchor="middle" font-size="16" fill="#455760">text, state</text>
    <text x="127" y="309" text-anchor="middle" font-size="16" fill="#455760">or media</text>
    <text x="378" y="245" text-anchor="middle" font-size="22" font-weight="700">Hard rules</text>
    <text x="378" y="278" text-anchor="middle" font-size="16" fill="#455760">auth, privacy, spend</text>
    <text x="378" y="302" text-anchor="middle" font-size="16" fill="#455760">and explicit user choice</text>
    <text x="595" y="242" text-anchor="middle" font-size="21" font-weight="800">Decision</text>
    <text x="595" y="270" text-anchor="middle" font-size="21" font-weight="800">model</text>
    <text x="595" y="304" text-anchor="middle" font-size="15" fill="#455760">choice / yes-no</text>
    <text x="595" y="326" text-anchor="middle" font-size="15" fill="#455760">score + probabilities</text>
    <text x="815" y="82" text-anchor="middle" font-size="20" font-weight="700">Local fast model</text>
    <text x="815" y="112" text-anchor="middle" font-size="15" fill="#455760">low cost, low risk</text>
    <text x="815" y="206" text-anchor="middle" font-size="20" font-weight="700">Specialist model</text>
    <text x="815" y="236" text-anchor="middle" font-size="15" fill="#455760">code, vision, search</text>
    <text x="815" y="330" text-anchor="middle" font-size="20" font-weight="700">Frontier model</text>
    <text x="815" y="360" text-anchor="middle" font-size="15" fill="#455760">hard or ambiguous work</text>
    <text x="815" y="447" text-anchor="middle" font-size="20" font-weight="700">Human review</text>
    <text x="815" y="475" text-anchor="middle" font-size="15" fill="#455760">high consequence</text>
    <text x="480" y="503" text-anchor="middle" font-size="16" fill="#455760">The model recommends a lane. Application policy remains in control.</text>
  </g>
</svg>
