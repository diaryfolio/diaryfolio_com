  <text x="44" y="110" fill="#18232c" font-family="system-ui,sans-serif" font-size="32" font-weight="700">A route through</text>
  <text x="44" y="150" fill="#18232c" font-family="system-ui,sans-serif" font-size="32" font-weight="700">the airways</text>
