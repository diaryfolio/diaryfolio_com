<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">A portrait crop becoming a 6 x 4 inch passport photo print sheet</title>
  <desc id="desc">A 35 x 45 millimetre portrait on the left points to a print sheet containing eight identical portraits on the right.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12202a"/>
      <stop offset="1" stop-color="#20323d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#071015" flood-opacity=".32"/>
    </filter>
    <g id="portrait">
      <rect width="108" height="139" rx="7" fill="#edf3f4" stroke="#b8c7cd" stroke-width="2"/>
      <circle cx="54" cy="48" r="25" fill="#7aa5ad"/>
      <path d="M22 122c3-30 16-44 32-44s29 14 32 44" fill="#426a73"/>
      <path d="M24 18h60M24 126h60" stroke="#0a8395" stroke-width="2" stroke-dasharray="5 5" opacity=".7"/>
    </g>
  </defs>
  <rect width="1200" height="675" rx="30" fill="url(#background)"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="72" y="82" fill="#eaf3f5" font-size="32" font-weight="700">35 x 45 mm photo</text>
    <text x="714" y="82" fill="#eaf3f5" font-size="32" font-weight="700">6 x 4 inch sheet</text>
  </g>
  <g transform="translate(118 132) scale(2.55)" filter="url(#shadow)">
    <use href="#portrait"/>
  </g>
  <g fill="none" stroke="#49c3ce" stroke-linecap="round" stroke-linejoin="round">
    <path d="M445 332h128" stroke-width="11"/>
    <path d="m546 300 32 32-32 32" stroke-width="11"/>
  </g>
  <g transform="translate(626 142)" filter="url(#shadow)">
    <rect width="500" height="333" rx="14" fill="#fff"/>
    <g transform="translate(25 24) scale(.94)">
      <use href="#portrait" x="0" y="0"/>
      <use href="#portrait" x="123" y="0"/>
      <use href="#portrait" x="246" y="0"/>
      <use href="#portrait" x="369" y="0"/>
      <use href="#portrait" x="0" y="150"/>
      <use href="#portrait" x="123" y="150"/>
      <use href="#portrait" x="246" y="150"/>
      <use href="#portrait" x="369" y="150"/>
    </g>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22">
    <text x="108" y="576" fill="#b9cbd0">Crop only if the authority permits it</text>
    <text x="682" y="525" fill="#b9cbd0">Print at actual size, then measure</text>
  </g>
</svg>
